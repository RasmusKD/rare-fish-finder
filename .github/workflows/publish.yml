name: Publish

# Runs when you push a version tag, e.g.:
#   git tag v3.0.1 && git push origin v3.0.1
# Tag as vX.Y.Z and nothing else: mc-publish derives the Modrinth version name
# from the tag, so v2.8.1-release published a version literally called
# "2.8.1-release".
#
# Verifies against BOTH supported Minecraft versions, then builds the mod,
# attaches the jar to a GitHub release, and publishes to Modrinth.
#
# Modrinth setup (one-time):
#   1. Create the project on https://modrinth.com and note its project ID
#      (Settings -> copy ID, an 8-character string).
#   2. Create a personal access token at https://modrinth.com/settings/pats
#      with the "Create versions" scope.
#   3. Add it to this repo: Settings -> Secrets and variables -> Actions ->
#      new repository secret named MODRINTH_TOKEN.
# Until the token secret exists, the Modrinth step is skipped and only the
# GitHub release is created.

on:
  push:
    tags:
      - "v*"
    # Also on ordinary pushes: the verify job is the whole point, and it is
    # worthless if it only runs at release time, when you are already tagging
    # and in a hurry.
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  # ONE jar runs on both 26.1.x and 26.2, and the two are NOT source-compatible
  # (see VERSIONS.md). A build against only one of them is how 2.5.2 and 2.8.0
  # both shipped crashing on 26.2 - each compiled fine against the version its
  # author had configured, and nothing checked the other. This job is the gate:
  # publish cannot run unless both compile.
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ["26.1.2", "26.2"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build against Minecraft ${{ matrix.minecraft }}
        run: ./gradlew build -Pminecraft_version=${{ matrix.minecraft }}

  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build

      - name: Publish to GitHub release
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: build/libs/!(*-sources).jar
          loaders: fabric
          game-versions: ">=26.1"

      - name: Publish to Modrinth
        if: env.MODRINTH_TOKEN != ''
        uses: Kir-Antipov/mc-publish@v3.3
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        with:
          modrinth-id: FVGRgACI
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: build/libs/!(*-sources).jar
          loaders: fabric
          game-versions: ">=26.1"
