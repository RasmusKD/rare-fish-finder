name: Publish

# Runs when you push a version tag, e.g.:
#   git tag v3.0.1 && git push origin v3.0.1
# Tag as vX.Y.Z and nothing else: mc-publish derives the Modrinth version name
# from the tag, so v2.8.1-release published a version literally called
# "2.8.1-release".
#
# Verifies both jars against ALL their supported Minecraft versions, then builds
# the two jars, attaches them to a GitHub release, and publishes to Modrinth.
#
# Modrinth setup (one-time):
#   1. Create the project on https://modrinth.com and note its project ID
#      (Settings -> copy ID, an 8-character string).
#   2. Create a personal access token at https://modrinth.com/settings/pats
#      with the "Create versions" scope.
#   3. Add it to this repo: Settings -> Secrets and variables -> Actions ->
#      new repository secret named MODRINTH_TOKEN.
# Until the token secret exists, the Modrinth step is skipped and only the
# GitHub release is created.

on:
  push:
    tags:
      - "v*"
    # Also on ordinary pushes: the verify job is the whole point, and it is
    # worthless if it only runs at release time, when you are already tagging
    # and in a hurry.
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  # The 26.1/26.2 jar and the 26.3 jar are separate builds and NOT
  # source-compatible (see VERSIONS.md). A build against only one version is
  # how 2.5.2 and 2.8.0 both shipped crashing on 26.2 - each compiled fine
  # against the version its author had configured, and nothing checked the
  # other. This job is the gate: every jar is compiled against every Minecraft
  # version it claims and runs the mixin-class check; publish cannot run unless
  # all of them pass.
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Minecraft, Fabric API, Cloth Config and Mod Menu move TOGETHER. A 26.1
        # Fabric API against 26.2 does not merely mismatch at runtime: its
        # interface injection (FabricTagAppender -> TagAppender) fails during
        # Loom's setup, before a line of this mod compiles, with an error that
        # reads like a Loom bug. Override one without the other and the leg is
        # red for a reason that has nothing to do with the code under test.
        include:
          - minecraft: "26.1.2"
            fabric: "0.155.2+26.1.2"
            cloth: "26.1.154"
            modmenu: "18.0.0"
            target: ""
          - minecraft: "26.2"
            fabric: "0.158.0+26.2"
            cloth: "26.2.155"
            modmenu: "20.0.3"
            target: ""
          - minecraft: "26.3"
            fabric: "0.163.0+26.3"
            cloth: "26.3.158"
            modmenu: "21.0.0"
            target: "26.3"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build against Minecraft ${{ matrix.minecraft }}
        run: >
          ./gradlew build
          -Pminecraft_version=${{ matrix.minecraft }}
          -Pfabric_version=${{ matrix.fabric }}
          -Pclothconfig_version=${{ matrix.cloth }}
          -Pmodmenu_version=${{ matrix.modmenu }}
          -Ploader_version=0.19.5
          ${{ matrix.target != '' && format('-PmcTarget={0}', matrix.target) || '' }}

  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the changelog is the commit subjects since the
          # previous tag, so shallow clones would leave it empty.
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # Two jars: the default build (26.1 and 26.2) and the 26.3 build.
      - name: Build both jars
        run: |
          ./gradlew clean build
          mkdir dist
          cp build/libs/*+26.1.jar dist/
          ./gradlew clean build -PmcTarget=26.3
          cp build/libs/*+26.3.jar dist/

      # Every release gets a changelog without anyone writing one: the
      # commit subjects since the previous tag, minus the version bump.
      - name: Collect changelog
        id: changelog
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "text<<CHANGELOG_EOF"
            if [ -n "$prev" ]; then
              git log --pretty='- %s' "$prev..${GITHUB_REF_NAME}" | grep -v '^- Version ' || true
            fi
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub release
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          changelog: ${{ steps.changelog.outputs.text }}
          files: dist/*+26.1.jar
          loaders: fabric
          game-versions: ">=26.1 <26.3"

      - name: Publish the 26.3 jar to the GitHub release
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          changelog: ${{ steps.changelog.outputs.text }}
          files: dist/*+26.3.jar
          loaders: fabric
          game-versions: ">=26.3"

      - name: Publish to Modrinth
        if: env.MODRINTH_TOKEN != ''
        uses: Kir-Antipov/mc-publish@v3.3
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        with:
          modrinth-id: FVGRgACI
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          changelog: ${{ steps.changelog.outputs.text }}
          files: dist/*+26.1.jar
          loaders: fabric
          game-versions: ">=26.1 <26.3"

      - name: Publish the 26.3 jar to Modrinth
        if: env.MODRINTH_TOKEN != ''
        uses: Kir-Antipov/mc-publish@v3.3
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        with:
          modrinth-id: FVGRgACI
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          changelog: ${{ steps.changelog.outputs.text }}
          files: dist/*+26.3.jar
          loaders: fabric
          game-versions: ">=26.3"
