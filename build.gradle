plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

// -PmcTarget=26.3 builds the 26.3 jar: pins from gradle-26.3.properties plus the
// sources under src/mc26_3, which replace same-named files of src/main.
if (project.findProperty('mcTarget') == '26.3') {
    def pins = new Properties()
    file('gradle-26.3.properties').withInputStream { pins.load(it) }
    pins.each { k, v -> project.setProperty(k as String, v as String) }
}
def modern = project.minecraft_version.startsWith('26.3')
def mcLabel = modern ? '26.3' : '26.1'

version = "${project.mod_version}+${mcLabel}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url "https://api.modrinth.com/maven" }
}

loom {
    mods {
        "rarefishfinder" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Config and ModMenu
    implementation "me.shedaniel.cloth:cloth-config-fabric:${project.clothconfig_version}"
    implementation "com.terraformersmc:modmenu:${project.modmenu_version}"

    // ClientSort, compile only: the compat class is loaded lazily and only
    // when the mod is present at runtime
    compileOnly "maven.modrinth:clientsort:3.102.5+26.1.2"
    compileOnly "maven.modrinth:mouse-wheelie:1.16.3+mc26.1"
    // Better Advancements substitutes its own screen for the vanilla one, so
    // the Fish Collection tab needs a second mixin against THEIR screen or it
    // silently disappears for their users. compileOnly: their jar is never
    // shipped, and the mixin is gated on the mod being present at runtime.
    // Their Common sourceset is compiled once and reused across Minecraft
    // versions (verified: BetterAdvancementsScreen.class is byte-identical in
    // their 26.1.2 and 26.2 jars), so one coordinate serves both our legs.
    compileOnly "maven.modrinth:better-advancements:0.6.0.72"
}

// The 26.3 jar is built from src/main plus src/mc26_3: a file under src/mc26_3/{java,resources}
// replaces the same-named file of src/main, and src/mc26_3/remove.txt lists src/main files
// (relative to java/ or resources/) that the 26.3 jar drops.
def overlaid = [] as Set
def removed = [] as Set
def overlayRoot = file('src/mc26_3')
['java', 'resources'].each { kind ->
    def dir = new File(overlayRoot, kind)
    if (dir.exists()) {
        dir.eachFileRecurse { f ->
            if (f.isFile()) {
                overlaid << ("${kind}/" + dir.toPath().relativize(f.toPath()).toString().replace(File.separator, '/')).toString()
            }
        }
    }
}
def removeList = new File(overlayRoot, 'remove.txt')
if (removeList.exists()) {
    removeList.eachLine { l -> if (l.trim() && !l.startsWith('#')) removed << l.trim() }
}
def replacedInMain = { String kind, element ->
    def path = element.file.path.replace(File.separator, '/')
    element.file.isFile() && path.contains("/src/main/${kind}/") &&
            (overlaid.contains("${kind}/${element.relativePath.pathString}".toString()) ||
                    removed.contains("${kind}/${element.relativePath.pathString}".toString()))
}
if (modern) {
    sourceSets.main.java {
        srcDir 'src/mc26_3/java'
        exclude { element -> replacedInMain('java', element) }
    }
    sourceSets.main.resources {
        srcDir 'src/mc26_3/resources'
        exclude { element -> replacedInMain('resources', element) }
    }
}

def mcRange = modern ? '>=26.3' : '>=26.1 <26.3'

processResources {
    inputs.property "version", project.version
    inputs.property "loader_version", project.loader_version
    inputs.property "mc_range", mcRange
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "loader_version": project.loader_version,
                "mc_range": mcRange
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
    repositories {
    }
}

// Every mixin a config lists must be a compiled class of this variant's jar.
tasks.register('verifyMixinClasses') {
    dependsOn tasks.named('classes')
    doLast {
        def classesDir = sourceSets.main.java.destinationDirectory.get().asFile
        def resDir = sourceSets.main.output.resourcesDir
        resDir.eachFileMatch(~/.*\.mixins\.json/) { cfg ->
            def json = new groovy.json.JsonSlurper().parse(cfg)
            def names = (json.mixins ?: []) + (json.client ?: []) + (json.server ?: [])
            names.each { n ->
                def cls = new File(classesDir, "${json.package.replace('.', '/')}/${n.replace('.', '/')}.class")
                if (!cls.exists()) {
                    throw new GradleException("${cfg.name} lists ${json.package}.${n}, which is not compiled in this variant")
                }
            }
        }
    }
}
tasks.named('check') { dependsOn 'verifyMixinClasses' }
